version: '3.8'

services:
  odakmentor-app:
    build: .
    container_name: odakmentor-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - odakmentor-network

  # Optional: Add a reverse proxy for SSL termination
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./ssl:/etc/nginx/certs:ro
    environment:
      - DEFAULT_HOST=your-domain.com
    restart: unless-stopped
    networks:
      - odakmentor-network

networks:
  odakmentor-network:
    driver: bridge

volumes:
  ssl-certs:
    driver: local
